name: Daily Flight Data Collector

on:
  schedule:
    - cron: '0 5 * * *'  # 한국시간 오후 2시 (UTC 05:00)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight collector
        run: python flight_collector.py
        env:
          API_KEY_ICN: ${{ secrets.API_KEY_ICN }}

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add *.csv
          # 변경사항이 있을 때만 커밋 (에러 방지)
          git commit -m "Update flight data: $(date +'%Y-%m-%d')" || exit 0

          # GitHub 서버측 일시적 push 오류(fatal error in commit_refs, non-fast-forward 등) 대비 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push 성공 (시도 $i)"
              exit 0
            fi
            echo "⚠️ Push 실패 (시도 $i/5). 원격 변경사항 반영 후 10초 뒤 재시도..."
            sleep 10
            git pull --rebase origin main || true
          done

          echo "❌ 5회 재시도 후에도 push 실패"
          exit 1
